<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bandwidtharr</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --qbit: #4f9dff;
    --sab: #ff9f4f;
    --budget: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 20px;
    letter-spacing: 0.02em;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 480px) {
    .cards { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    margin-left: auto; background: var(--muted);
  }
  .status-dot.ok { background: #3ecf6d; }
  .status-dot.error { background: #ef4444; }
  .link-status {
    display: none;
    flex-direction: column;
    gap: 2px;
    margin: -10px 0 16px;
  }
  .link-status.show { display: flex; }
  .link-status-main {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .link-status .status-dot { margin-left: 0; }
  .link-status-detail {
    font-size: 12px;
    color: var(--muted);
    opacity: 0.75;
  }
  .link-log-card {
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .link-log-card.show { display: block; }
  .link-log-header {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .link-log {
    max-height: 160px;
    overflow-y: auto;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .link-log-entry {
    display: flex;
    gap: 10px;
    padding: 5px 0;
    border-top: 1px solid var(--border);
  }
  .link-log-entry:first-child { border-top: none; }
  .link-log-entry .ts { color: var(--muted); flex-shrink: 0; }
  .link-log-entry .dir { flex-shrink: 0; font-weight: 600; }
  .link-log-entry .dir.failover { color: #ef4444; }
  .link-log-entry .dir.recovery { color: #3ecf6d; }
  .link-log-empty { color: var(--muted); font-size: 12px; }
  .card .speed { font-size: 26px; font-weight: 600; line-height: 1.1; }
  .card .limit { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card .limit.error { color: #ef4444; }
  .bar-track {
    margin-top: 10px;
    height: 6px;
    border-radius: 3px;
    background: #10121600;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .graph-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .graph-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend { display: flex; gap: 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  canvas { width: 100%; height: 220px; display: block; }
  .total-line { color: var(--text); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>bandwidtharr</h1>
  <div class="link-status" id="link-status">
    <div class="link-status-main">
      <span class="status-dot" id="link-status-dot"></span>
      <span id="link-status-text">Link: primary</span>
    </div>
    <div class="link-status-detail" id="link-status-detail"></div>
  </div>
  <div class="cards">
    <div class="card">
      <div class="label">
        <span class="dot" style="background:var(--qbit)"></span>qBittorrent
        <span class="status-dot" id="qbit-status-dot" title="connecting..."></span>
      </div>
      <div class="speed" id="qbit-speed">&mdash;</div>
      <div class="limit" id="qbit-limit">limit &mdash;</div>
      <div class="bar-track"><div class="bar-fill" id="qbit-bar" style="background:var(--qbit); width:0%"></div></div>
    </div>
    <div class="card">
      <div class="label">
        <span class="dot" style="background:var(--sab)"></span>SABnzbd
        <span class="status-dot" id="sab-status-dot" title="connecting..."></span>
      </div>
      <div class="speed" id="sab-speed">&mdash;</div>
      <div class="limit" id="sab-limit">limit &mdash;</div>
      <div class="bar-track"><div class="bar-fill" id="sab-bar" style="background:var(--sab); width:0%"></div></div>
    </div>
  </div>

  <div class="graph-card">
    <div class="graph-header">
      <div class="legend">
        <span><span class="dot" style="background:var(--qbit)"></span>qBittorrent</span>
        <span><span class="dot" style="background:var(--sab)"></span>SABnzbd</span>
        <span><span class="dot" style="background:var(--budget)"></span>budget</span>
      </div>
      <div class="total-line" id="total-line">&mdash;</div>
    </div>
    <canvas id="graph"></canvas>
  </div>

  <div class="link-log-card" id="link-log-card">
    <div class="link-log-header">Failover log</div>
    <div class="link-log" id="link-log">
      <div class="link-log-empty">No failovers recorded yet.</div>
    </div>
  </div>
</div>

<script>
const qbitSpeedEl = document.getElementById('qbit-speed');
const qbitLimitEl = document.getElementById('qbit-limit');
const qbitBarEl = document.getElementById('qbit-bar');
const qbitStatusDotEl = document.getElementById('qbit-status-dot');
const sabSpeedEl = document.getElementById('sab-speed');
const sabLimitEl = document.getElementById('sab-limit');
const sabBarEl = document.getElementById('sab-bar');
const sabStatusDotEl = document.getElementById('sab-status-dot');
const totalLineEl = document.getElementById('total-line');
const linkStatusEl = document.getElementById('link-status');
const linkStatusDotEl = document.getElementById('link-status-dot');
const linkStatusTextEl = document.getElementById('link-status-text');
const linkStatusDetailEl = document.getElementById('link-status-detail');
const linkLogCardEl = document.getElementById('link-log-card');
const linkLogEl = document.getElementById('link-log');
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');

function bytesToMbps(b) { return (b * 8) / 1_000_000; }
function fmt(mbps) { return mbps.toFixed(0) + ' Mbps'; }

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

function drawGraph(history, total) {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  const pad = { top: 10, right: 10, bottom: 18, left: 40 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  const totalMbps = bytesToMbps(total);
  const points = history.map(([t, qb, sb]) => [t, bytesToMbps(qb), bytesToMbps(sb)]);
  const maxY = Math.max(totalMbps * 1.1, ...points.map(p => p[1] + p[2]), 10);

  const tMin = points.length ? points[0][0] : 0;
  const tMax = points.length ? points[points.length - 1][0] : 1;
  const tSpan = Math.max(tMax - tMin, 1);

  const x = (t) => pad.left + ((t - tMin) / tSpan) * plotW;
  const y = (v) => pad.top + plotH - (v / maxY) * plotH;

  // gridlines + y-axis labels
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.fillStyle = '#8b93a1';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = (maxY / steps) * i;
    const yy = y(v);
    ctx.beginPath();
    ctx.moveTo(pad.left, yy);
    ctx.lineTo(pad.left + plotW, yy);
    ctx.stroke();
    ctx.fillText(v.toFixed(0), pad.left - 6, yy + 3);
  }

  if (points.length > 1) {
    // stacked area: qbit on bottom, sab stacked on top
    ctx.beginPath();
    ctx.moveTo(x(points[0][0]), y(0));
    points.forEach(p => ctx.lineTo(x(p[0]), y(p[1])));
    ctx.lineTo(x(points[points.length - 1][0]), y(0));
    ctx.closePath();
    ctx.fillStyle = 'rgba(79,157,255,0.35)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x(points[0][0]), y(points[0][1]));
    points.forEach(p => ctx.lineTo(x(p[0]), y(p[1] + p[2])));
    for (let i = points.length - 1; i >= 0; i--) {
      ctx.lineTo(x(points[i][0]), y(points[i][1]));
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,159,79,0.35)';
    ctx.fill();
  }

  // budget line
  ctx.beginPath();
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = '#6b7280';
  ctx.moveTo(pad.left, y(totalMbps));
  ctx.lineTo(pad.left + plotW, y(totalMbps));
  ctx.stroke();
  ctx.setLineDash([]);
}

function updateCard(speedEl, limitEl, barEl, statusDotEl, speed, limit, ok, error) {
  statusDotEl.classList.toggle('ok', ok);
  statusDotEl.classList.toggle('error', !ok);
  statusDotEl.title = ok ? 'connected' : ('unreachable: ' + (error || 'unknown error'));

  if (ok) {
    speedEl.textContent = fmt(speed);
    limitEl.textContent = 'limit ' + fmt(limit);
    limitEl.classList.remove('error');
    barEl.style.width = Math.min(100, (speed / Math.max(limit, 1)) * 100) + '%';
  } else {
    limitEl.textContent = '⚠ ' + (error || 'unreachable');
    limitEl.classList.add('error');
  }
}

function fmtRelative(seconds) {
  if (seconds < 1) return 'now';
  if (seconds < 60) return Math.round(seconds) + 's';
  return Math.round(seconds / 60) + 'm';
}

function updateLink(linkEnabled, activeLink, linkOk, linkError, totalMbps, detail, lastCheckAt, nextCheckAt) {
  linkStatusEl.classList.toggle('show', linkEnabled);
  linkLogCardEl.classList.toggle('show', linkEnabled);
  if (!linkEnabled) return;

  linkStatusDotEl.classList.toggle('ok', linkOk && activeLink === 'primary');
  linkStatusDotEl.classList.toggle('error', !linkOk);

  if (!linkOk) {
    linkStatusTextEl.textContent = 'Link: unknown (' + (linkError || 'detector error') + ')';
  } else if (activeLink === 'backup') {
    linkStatusTextEl.textContent = 'Link: backup — throttled to ' + fmt(totalMbps);
  } else {
    linkStatusTextEl.textContent = 'Link: primary';
  }

  const nowSec = Date.now() / 1000;
  const parts = [];
  if (detail) parts.push(detail);
  if (lastCheckAt) parts.push('checked ' + fmtRelative(nowSec - lastCheckAt) + ' ago');
  if (nextCheckAt) parts.push('next in ' + fmtRelative(nextCheckAt - nowSec));
  linkStatusDetailEl.textContent = parts.join(' · ');
}

function updateLinkLog(events) {
  if (!events || !events.length) {
    linkLogEl.innerHTML = '<div class="link-log-empty">No failovers recorded yet.</div>';
    return;
  }
  const rows = events.slice().reverse().map(([ts, previous, current, oldMbps, newMbps]) => {
    const isFailover = current === 'backup';
    const dirClass = isFailover ? 'failover' : 'recovery';
    const dirText = isFailover ? 'Failed over' : 'Recovered';
    const time = new Date(ts * 1000).toLocaleTimeString();
    return '<div class="link-log-entry"><span class="ts">' + time + '</span>'
      + '<span class="dir ' + dirClass + '">' + dirText + '</span>'
      + '<span>' + fmt(oldMbps) + ' → ' + fmt(newMbps) + '</span></div>';
  });
  linkLogEl.innerHTML = rows.join('');
}

async function poll() {
  try {
    const res = await fetch('/api/state', { cache: 'no-store' });
    const s = await res.json();

    const qbitSpeed = bytesToMbps(s.qbit_speed);
    const qbitLimit = bytesToMbps(s.qbit_limit);
    const sabSpeed = bytesToMbps(s.sab_speed);
    const sabLimit = bytesToMbps(s.sab_limit);
    const total = bytesToMbps(s.total);

    updateCard(qbitSpeedEl, qbitLimitEl, qbitBarEl, qbitStatusDotEl, qbitSpeed, qbitLimit, s.qbit_ok, s.qbit_error);
    updateCard(sabSpeedEl, sabLimitEl, sabBarEl, sabStatusDotEl, sabSpeed, sabLimit, s.sab_ok, s.sab_error);

    if (s.qbit_ok && s.sab_ok) {
      totalLineEl.textContent = fmt(qbitSpeed + sabSpeed) + ' / ' + fmt(total) + ' budget';
    } else {
      totalLineEl.textContent = 'not arbitrating (waiting on both apps)';
    }

    updateLink(s.link_enabled, s.active_link, s.link_ok, s.link_error, total, s.link_detail, s.last_link_check_at, s.next_link_check);
    updateLinkLog(s.link_events);
    drawGraph(s.history, s.total);
  } catch (e) {
    totalLineEl.textContent = 'dashboard connection lost';
    [qbitStatusDotEl, sabStatusDotEl].forEach(el => {
      el.classList.remove('ok');
      el.classList.add('error');
      el.title = 'lost contact with bandwidtharr itself';
    });
  }
}

resizeCanvas();
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
