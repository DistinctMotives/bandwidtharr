  :root {
    --housing: #111316;
    --module: #191c20;
    --line: #2a2e33;
    --ink: #eef1ee;
    --dim: #7d8790;
    --dim-2: #4d545c;
    --fault: #e5484d;
    --ok: #5fbf82;
    --ch-qbit: #5fd4d0;
    --ch-sab: #e0a23d;
    --mono: 'Martian Mono', ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 2px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 28px 16px;
    background: var(--housing);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .commit-link {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim-2);
    text-decoration: none;
  }
  .commit-link:hover { color: var(--dim); text-decoration: underline; }

  .link-status {
    display: none;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding-bottom: 16px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .link-status.show { display: flex; }
  .link-status-state { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  .link-status-state .status-dot { margin-left: 0; }
  #link-status-text { color: var(--ink); }
  .link-status-timing { color: var(--dim-2); font-variant-numeric: tabular-nums; }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--dim-2);
  }
  .status-dot.ok { background: var(--ok); }
  .status-dot.error { background: var(--fault); }

  .panel {
    background: var(--module);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .channels {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .channel {
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }
  .channel:first-child { border-right: 1px solid var(--line); }
  @media (max-width: 480px) {
    .channels { grid-template-columns: 1fr; }
    .channel:first-child { border-right: none; }
  }

  .channel-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .channel-label .status-dot { margin-left: auto; }

  .reading {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 40px;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .reading .unit {
    font-size: 15px;
    font-weight: 500;
    color: var(--dim);
    margin-left: 6px;
  }

  .meter-track {
    position: relative;
    height: 6px;
    margin-top: 14px;
    background: var(--line);
    overflow: hidden;
    border-radius: 1px;
  }
  .meter-fill { height: 100%; transition: width 0.4s ease; }
  .meter-track::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(90deg, transparent 0 6px, var(--module) 6px 8px);
    pointer-events: none;
  }

  .channel-limit {
    margin-top: 10px;
    font-size: 11px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .channel-limit.error { color: var(--fault); }

  .budget-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--dim);
  }
  .budget-reading {
    font-family: var(--mono);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .graph-wrap { padding: 16px 20px 18px; }
  canvas { width: 100%; height: 200px; display: block; }

  .log-panel { margin-top: 16px; padding: 16px 20px; }
  .panel-label {
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 4px;
  }
  .log {
    max-height: 160px;
    overflow-y: auto;
  }
  .log-entry {
    display: flex;
    gap: 14px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .log-entry:first-child { border-top: none; }
  .log-entry .ts { color: var(--dim); flex-shrink: 0; }
  .log-entry .dir { flex-shrink: 0; width: 90px; white-space: nowrap; }
  .log-entry .dir.failover { color: var(--fault); }
  .log-entry .dir.recovery { color: var(--ok); }
  .log-entry .transition { color: var(--dim); }
  .log-empty { color: var(--dim); font-size: 12px; padding: 4px 0; }

  @media (prefers-reduced-motion: reduce) {
    .meter-fill { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>bandwidtharr</h1>
    <a class="commit-link" id="commit-link" href="#" style="display:none"></a>
  </div>

  <div class="link-status" id="link-status">
    <div class="link-status-state">
      <span class="status-dot" id="link-status-dot"></span>
      <span id="link-status-text">primary</span>
    </div>
    <div class="link-status-timing" id="link-status-detail"></div>
  </div>

  <div class="panel">
    <div class="channels">
      <div class="channel">
        <div class="channel-label">
          <span class="dot" style="background:var(--ch-qbit)"></span>qBittorrent
          <span class="status-dot" id="qbit-status-dot" title="connecting..."></span>
        </div>
        <div class="reading" id="qbit-speed">&mdash;</div>
        <div class="meter-track"><div class="meter-fill" id="qbit-bar" style="background:var(--ch-qbit); width:0%"></div></div>
        <div class="channel-limit" id="qbit-limit">limit &mdash;</div>
      </div>
      <div class="channel">
        <div class="channel-label">
          <span class="dot" style="background:var(--ch-sab)"></span>SABnzbd
          <span class="status-dot" id="sab-status-dot" title="connecting..."></span>
        </div>
        <div class="reading" id="sab-speed">&mdash;</div>
        <div class="meter-track"><div class="meter-fill" id="sab-bar" style="background:var(--ch-sab); width:0%"></div></div>
        <div class="channel-limit" id="sab-limit">limit &mdash;</div>
      </div>
    </div>

    <div class="budget-row">
      <span>budget</span>
      <span class="budget-reading" id="total-line">&mdash;</span>
    </div>

    <div class="graph-wrap">
      <canvas id="graph"></canvas>
    </div>
  </div>

  <div class="panel log-panel" id="link-log-card">
    <div class="panel-label">failover log</div>
    <div class="log" id="link-log">
      <div class="log-empty">no failovers recorded yet</div>
    </div>
  </div>
</div>

<script>
const qbitSpeedEl = document.getElementById('qbit-speed');
const qbitLimitEl = document.getElementById('qbit-limit');
const qbitBarEl = document.getElementById('qbit-bar');
const qbitStatusDotEl = document.getElementById('qbit-status-dot');
const sabSpeedEl = document.getElementById('sab-speed');
const sabLimitEl = document.getElementById('sab-limit');
const sabBarEl = document.getElementById('sab-bar');
const sabStatusDotEl = document.getElementById('sab-status-dot');
const totalLineEl = document.getElementById('total-line');
const linkStatusEl = document.getElementById('link-status');
const linkStatusDotEl = document.getElementById('link-status-dot');
const linkStatusTextEl = document.getElementById('link-status-text');
const linkStatusDetailEl = document.getElementById('link-status-detail');
const linkLogCardEl = document.getElementById('link-log-card');
const linkLogEl = document.getElementById('link-log');
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const commitLinkEl = document.getElementById('commit-link');

function bytesToMbps(b) { return (b * 8) / 1_000_000; }
function fmt(mbps) { return mbps.toFixed(0) + ' Mbps'; }

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

function drawGraph(history, total) {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  const pad = { top: 10, right: 10, bottom: 18, left: 40 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  const totalMbps = bytesToMbps(total);
  const points = history.map(([t, qb, sb]) => [t, bytesToMbps(qb), bytesToMbps(sb)]);
  const maxY = Math.max(totalMbps * 1.1, ...points.map(p => p[1] + p[2]), 10);

  const tMin = points.length ? points[0][0] : 0;
  const tMax = points.length ? points[points.length - 1][0] : 1;
  const tSpan = Math.max(tMax - tMin, 1);

  const x = (t) => pad.left + ((t - tMin) / tSpan) * plotW;
  const y = (v) => pad.top + plotH - (v / maxY) * plotH;

  // gridlines + y-axis labels
  ctx.strokeStyle = 'rgba(238,241,238,0.05)';
  ctx.fillStyle = '#7d8790';
  ctx.font = '10px ui-monospace, monospace';
  ctx.textAlign = 'right';
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = (maxY / steps) * i;
    const yy = y(v);
    ctx.beginPath();
    ctx.moveTo(pad.left, yy);
    ctx.lineTo(pad.left + plotW, yy);
    ctx.stroke();
    ctx.fillText(v.toFixed(0), pad.left - 6, yy + 3);
  }

  if (points.length > 1) {
    // stacked area: qbit on bottom, sab stacked on top
    ctx.beginPath();
    ctx.moveTo(x(points[0][0]), y(0));
    points.forEach(p => ctx.lineTo(x(p[0]), y(p[1])));
    ctx.lineTo(x(points[points.length - 1][0]), y(0));
    ctx.closePath();
    ctx.fillStyle = 'rgba(95,212,208,0.28)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x(points[0][0]), y(points[0][1]));
    points.forEach(p => ctx.lineTo(x(p[0]), y(p[1] + p[2])));
    for (let i = points.length - 1; i >= 0; i--) {
      ctx.lineTo(x(points[i][0]), y(points[i][1]));
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(224,162,61,0.28)';
    ctx.fill();
  }

  // budget line
  ctx.beginPath();
  ctx.setLineDash([3, 3]);
  ctx.strokeStyle = '#7d8790';
  ctx.moveTo(pad.left, y(totalMbps));
  ctx.lineTo(pad.left + plotW, y(totalMbps));
  ctx.stroke();
  ctx.setLineDash([]);
}

function updateCard(speedEl, limitEl, barEl, statusDotEl, speed, limit, ok, error) {
  statusDotEl.classList.toggle('ok', ok);
  statusDotEl.classList.toggle('error', !ok);
  statusDotEl.title = ok ? 'connected' : ('unreachable: ' + (error || 'unknown error'));

  if (ok) {
    speedEl.innerHTML = speed.toFixed(0) + '<span class="unit">Mbps</span>';
    limitEl.textContent = 'limit ' + fmt(limit);
    limitEl.classList.remove('error');
    barEl.style.width = Math.min(100, (speed / Math.max(limit, 1)) * 100) + '%';
  } else {
    limitEl.textContent = error || 'unreachable';
    limitEl.classList.add('error');
  }
}

function fmtRelative(seconds) {
  if (seconds < 1) return 'now';
  if (seconds < 60) return Math.round(seconds) + 's';
  return Math.round(seconds / 60) + 'm';
}

function timingText(lastCheckAt, nextCheckAt) {
  const nowSec = Date.now() / 1000;
  const parts = [];
  if (lastCheckAt) parts.push('checked ' + fmtRelative(nowSec - lastCheckAt) + ' ago');
  if (nextCheckAt) parts.push('next in ' + fmtRelative(nextCheckAt - nowSec));
  return parts.join(' · ');
}

function updateLink(linkEnabled, activeLink, linkOk, linkError, totalMbps, lastCheckAt, nextCheckAt) {
  linkStatusEl.classList.toggle('show', linkEnabled);
  linkLogCardEl.classList.toggle('show', linkEnabled);
  if (!linkEnabled) return;

  linkStatusDotEl.classList.toggle('ok', linkOk && activeLink === 'primary');
  linkStatusDotEl.classList.toggle('error', !linkOk);

  if (!linkOk) {
    linkStatusTextEl.textContent = 'unknown · ' + (linkError || 'detector error');
    linkStatusDetailEl.textContent = '';
  } else if (activeLink === 'backup') {
    linkStatusTextEl.textContent = 'backup · throttled to ' + fmt(totalMbps);
    linkStatusDetailEl.textContent = timingText(lastCheckAt, nextCheckAt);
  } else {
    linkStatusTextEl.textContent = 'primary';
    linkStatusDetailEl.textContent = timingText(lastCheckAt, nextCheckAt);
  }
}

function updateLinkLog(events) {
  if (!events || !events.length) {
    linkLogEl.innerHTML = '<div class="log-empty">no failovers recorded yet</div>';
    return;
  }
  const rows = events.slice().reverse().map(([ts, previous, current, oldMbps, newMbps]) => {
    const isFailover = current === 'backup';
    const dirClass = isFailover ? 'failover' : 'recovery';
    const dirText = isFailover ? 'failed over' : 'recovered';
    const time = new Date(ts * 1000).toLocaleTimeString();
    return '<div class="log-entry"><span class="ts">' + time + '</span>'
      + '<span class="dir ' + dirClass + '">' + dirText + '</span>'
      + '<span class="transition">' + fmt(oldMbps) + ' → ' + fmt(newMbps) + '</span></div>';
  });
  linkLogEl.innerHTML = rows.join('');
}

async function poll() {
  try {
    const res = await fetch('/api/state', { cache: 'no-store' });
    const s = await res.json();

    const qbitSpeed = bytesToMbps(s.qbit_speed);
    const qbitLimit = bytesToMbps(s.qbit_limit);
    const sabSpeed = bytesToMbps(s.sab_speed);
    const sabLimit = bytesToMbps(s.sab_limit);
    const total = bytesToMbps(s.total);

    updateCard(qbitSpeedEl, qbitLimitEl, qbitBarEl, qbitStatusDotEl, qbitSpeed, qbitLimit, s.qbit_ok, s.qbit_error);
    updateCard(sabSpeedEl, sabLimitEl, sabBarEl, sabStatusDotEl, sabSpeed, sabLimit, s.sab_ok, s.sab_error);

    if (s.qbit_ok && s.sab_ok) {
      totalLineEl.textContent = fmt(qbitSpeed + sabSpeed) + ' / ' + fmt(total);
    } else {
      totalLineEl.textContent = 'waiting for both apps to respond';
    }

    updateLink(s.link_enabled, s.active_link, s.link_ok, s.link_error, total, s.last_link_check_at, s.next_link_check);
    updateLinkLog(s.link_events);
    drawGraph(s.history, s.total);

    if (s.commit) {
      commitLinkEl.href = 'https://github.com/DistinctMotives/bandwidtharr/commit/' + s.commit;
      commitLinkEl.textContent = s.commit.slice(0, 7);
      commitLinkEl.style.display = '';
    }
  } catch (e) {
    totalLineEl.textContent = 'dashboard connection lost';
    [qbitStatusDotEl, sabStatusDotEl].forEach(el => {
      el.classList.remove('ok');
      el.classList.add('error');
      el.title = 'lost contact with bandwidtharr itself';
    });
  }
}

resizeCanvas();
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
