services:
  bandwidtharr:
    image: ghcr.io/distinctmotives/bandwidtharr:latest
    build: .
    container_name: bandwidtharr
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE  # lets the non-root container user still bind WEB_PORT=80
    networks:
      - bandwidtharr_net
    env_file:
      - .env
    volumes:
      - bandwidtharr_state:/app/state

networks:
  bandwidtharr_net:
    external: true
    name: ${DOCKER_NETWORK:?set DOCKER_NETWORK in .env}

volumes:
  bandwidtharr_state:
